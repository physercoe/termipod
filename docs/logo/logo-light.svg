<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermiPod light icon">
  <defs>
    <linearGradient id="tile" x1="16%" y1="0%" x2="84%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#edf5fb"/>
      <stop offset="100%" stop-color="#d9e3f2"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="28%" cy="12%" r="82%">
      <stop offset="0%" stop-color="#3cdbc8" stop-opacity="0.13"/>
      <stop offset="58%" stop-color="#4198e0" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prompt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a990"/>
      <stop offset="48%" stop-color="#078fc8"/>
      <stop offset="100%" stop-color="#4d63d4"/>
    </linearGradient>
    <linearGradient id="spark" x1="14%" y1="0%" x2="86%" y2="100%">
