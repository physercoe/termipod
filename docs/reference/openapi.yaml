  /v1/teams/{team}/runs/{run}/config:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Run"
    put:
      tags: [Runs]
      operationId: putRunConfig
      summary: Upsert the run's config (hyperparameters)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config: { type: object, description: Run hyperparameters }
              required: [config]
      responses:
        "200": { description: Stored }
    get:
      tags: [Runs]
      operationId: getRunConfig
      summary: Get the run's config (config null when none logged)
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                type: object
                properties:
                  config: { type: object, nullable: true }
                  updated_at: { type: string }

  /v1/teams/{team}/runs/{run}/dataset_hint:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Run"
    get:
      tags: [Runs]
      operationId: getRunDatasetHint
      summary: What dataset this run's config names, and whether it is registered
      description: >-
        Reads the run's logged config (falling back to the frozen one) for a
        LeRobot-style dataset field, and resolves it against the datasets
        already registered in the run's project. Read-only and advisory —
        linking is PATCH /runs/{run} with dataset_id. `hint` is null when the
        config names no dataset, which is most runs.
      responses:
        "200":
          description: Hint (null when the config names no dataset)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hint:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/DatasetHint" }]
                  dataset_id:
                    type: string
                    description: >-
                      The registered dataset at the hinted location, or absent
                      when the project has never registered it.
                  linked_dataset_id:
                    type: string
                    description: The dataset already linked to this run, if any.
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/runs/{run}/system_metrics:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Run"
    put:
      tags: [Runs]
      operationId: putRunSystemMetrics
      summary: Replace GPU/CPU system series (sample-ordinal x-axis)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunMetricsBatch" }
      responses:
        "200": { description: Stored }
    get:
      tags: [Runs]
      operationId: getRunSystemMetrics
      summary: List run system-metric series
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunMetricsBatch" }

  /v1/teams/{team}/runs/{run}/alerts:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Run"
    put:
      tags: [Runs]
      operationId: putRunAlerts
      summary: Replace the run's alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alerts:
                  type: array
                  items:
                    type: object
                    properties:
                      title: { type: string }
                      text: { type: string }
                      level: { type: string }
                      step: { type: integer, nullable: true }
                      ts: { type: string }
                      alert_id: { type: string }
                    required: [title]
              required: [alerts]
      responses:
        "200": { description: Stored }
    get:
      tags: [Runs]
      operationId: getRunAlerts
      summary: List the run's alerts
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  # ======================================================================
  # Attention
  # ======================================================================

  /v1/teams/{team}/attention:
    parameters:
      - $ref: "#/components/parameters/Team"
    post:
      tags: [Attention]
      operationId: createAttention
      summary: Create attention item
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttentionCreateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionItem" }
    get:
      tags: [Attention]
      operationId: listAttention
      summary: List attention items
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [open, resolved] }
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Attention page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionPage" }

  /v1/teams/{team}/attention/{id}/context:
    parameters:
      - $ref: "#/components/parameters/Team"
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Attention]
      operationId: getAttentionContext
      summary: Surrounding events for triage
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionContext" }

  /v1/teams/{team}/attention/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/Team"
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attention]
      operationId: resolveAttention
      summary: Resolve without choice (info / digest items)
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionItem" }

  /v1/teams/{team}/attention/{id}/decide:
    parameters:
      - $ref: "#/components/parameters/Team"
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attention]
      operationId: decideAttention
      summary: Resolve with explicit choice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttentionDecideRequest" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionItem" }

  # ======================================================================
  # Admin (audit, policy, tokens, principals)
  # ======================================================================

  /v1/teams/{team}/audit:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [Admin]
      operationId: listAudit
      summary: List audit_events (filtered, paginated)
      parameters:
        - in: query
          name: actor_kind
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: target_kind
          schema: { type: string }
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Audit events page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventsPage" }

  /v1/teams/{team}/policy:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [Admin]
      operationId: getPolicy
      summary: Get team policy
      responses:
        "200":
          description: Policy
          content:
            application/yaml: {}
    put:
      tags: [Admin]
      operationId: putPolicy
      summary: Replace team policy
      requestBody:
        content:
          application/yaml: {}
      responses:
        "200": { description: Saved }

  /v1/teams/{team}/auth-tokens:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [Admin]
      operationId: listTokens
      summary: List tokens (no plaintext; metadata only)
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthToken" }
    post:
      tags: [Admin]
      operationId: issueToken
      summary: Mint a new token (returns plaintext once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokenRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedToken" }

  /v1/teams/{team}/auth-tokens/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/Team"
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Admin]
      operationId: revokeToken
      summary: Revoke token
      responses:
        "204": { description: Revoked }

  /v1/teams/{team}/principals:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [Admin]
      operationId: listPrincipals
      summary: List active principals (humans + agents)
      responses:
        "200":
          description: Principals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Principal" }

  # ======================================================================
  # MCP gateway
  # ======================================================================

  /mcp/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
        description: per-spawn MCP token
    post:
      tags: [MCP]
      operationId: mcpRPC
      summary: JSON-RPC entry for MCP — host-runner relays agent calls here
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        SHA-256 hashed in `auth_tokens.token_hash`. Plaintext is
        printed only once at issuance. Token kinds: owner / user /
        agent / host. See `permission-model.md`.

  parameters:
    Team:
      in: path
      name: team
      required: true
      schema: { type: string }
      description: Team identifier (default `default` in MVP)
    Host:
      in: path
      name: host
      required: true
      schema: { type: string }
    Agent:
      in: path
      name: agent
      required: true
      schema: { type: string }
    Project:
      in: path
      name: project
      required: true
      schema: { type: string }
    Channel:
      in: path
      name: channel
      required: true
      schema: { type: string }
    Session:
      in: path
      name: session
      required: true
      schema: { type: string }
    Run:
      in: path
      name: run
      required: true
      schema: { type: string }
    PageCursor:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque server-defined cursor
    PageLimit:
      in: query
      name: limit
      schema: { type: integer, default: 50, maximum: 200, minimum: 1 }
    SearchQuery:
      in: query
      name: q
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      schema: { type: string, format: uuid }
      description: |
        Optional client-generated UUID. Two requests with the same
        key + body return the same response without re-executing.
        Hub stores keys for 24 h.

  responses:
    BadRequest:
      description: Malformed request (validation)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Token valid; role insufficient
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Conflict:
      description: State conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    RateLimited:
      description: Rate limited; see Retry-After
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 problem-detail
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        audit_event_id: { type: string }
        context:
          type: object
          additionalProperties: true

    ServerInfo:
      type: object
      required: [server_version, supported_api_versions]
      properties:
        server_version: { type: string }
        supported_api_versions:
          type: array
          items: { type: string }
        schema_versions_supported:
          type: array
          items: { type: integer }
        commit: { type: string }
        build_time: { type: string, format: date-time }
        modified: { type: boolean }

    Page:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        total_estimate: { type: integer }

    SearchResults:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor: { type: string, nullable: true }

    Host:
      type: object
      required: [id, team_id, name, status]
      properties:
        id: { type: string }
        team_id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [online, offline, disconnected]
        last_seen_at: { type: string, format: date-time, nullable: true }
        capabilities_json:
          type: object
          additionalProperties: true
        ssh_hint_json:
          $ref: "#/components/schemas/SSHHint"
        runner_commit: { type: string }
        runner_build_time: { type: string }
        runner_modified: { type: boolean }
        created_at: { type: string, format: date-time }

    Dataset:
      type: object
      description: >-
        A dataset is a root of episodes — synchronized multimodal streams
        (multi-cam video, proprioception, actions, language) — that a policy is
        trained on or evaluated against (replay plan W1). The hub owns the row
        and the folded digest; the episodes themselves stay on the host.
      properties:
        id: { type: string }
        project_id: { type: string }
        host_id: { type: string, description: Host holding the bytes }
        name: { type: string }
        root_path: { type: string }
        source:
          type: string
          enum: [local, sftp, hf]
          description: Only `local` is readable today; the others register ahead of the SSH-forward wedge.
        format:
          type: string
          description: >-
            Filled from the digest once a host has read the root (e.g.
            lerobot_v3.0). Empty until then — use digest_ts to tell "not read
            yet" from "format not recognised".
        env_ref:
          type: string
          description: >-
            Opaque "family:env_id@version" provenance handle, reserved by the
            replay plan §3 and deliberately unvalidated. A refresh fills it only
            when empty, so a human-set value is never overwritten.
        digest:
          type: object
          additionalProperties: true
          description: The host-computed fold (ADR-038 shape).
        digest_schema_version: { type: integer }
        digest_ts: { type: string, format: date-time }
        fingerprint:
          $ref: "#/components/schemas/DatasetFingerprint"
        registered_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DatasetFingerprint:
      type: object
      description: >-
        Stat-only summary of the meta/ tree at fold time. Re-statting is cheap,
        so a client can say "digest may be stale — Refresh" without re-reading.
      properties:
        files: { type: integer }
        bytes: { type: integer, format: int64 }
        max_mod_time: { type: string, format: date-time }

    DatasetUnsupportedFormat:
      type: object
      description: >-
        A dataset whose generation this build refuses to parse. Never a
        best-effort partial read: invented numbers presented as dataset facts
        are worse than an honest refusal.
      properties:
        error: { type: string, enum: [unsupported_format] }
        codebase_version: { type: string }
        detail: { type: string }

    Episode:
      type: object
      description: >-
        One episode. The location fields answer "where are this episode's
        bytes" for layouts where many episodes share a file; in per-episode-file
        layouts they are absent.
      properties:
        index: { type: integer, format: int64 }
        length: { type: integer, format: int64, description: Frame count }
        duration_sec: { type: number }
        tasks: { type: array, items: { type: string } }
        data_chunk: { type: integer, format: int64 }
        data_file: { type: integer, format: int64 }
        from_index: { type: integer, format: int64, description: First row, inclusive }
        to_index: { type: integer, format: int64, description: Last row, exclusive }
        videos:
          type: object
          additionalProperties: { $ref: "#/components/schemas/EpisodeVideoSlice" }
          description: Video feature key to this episode's slice of the shared file.

    EpisodeVideoSlice:
      type: object
      properties:
        chunk: { type: integer, format: int64 }
        file: { type: integer, format: int64 }
        from_ts: { type: number }
        to_ts: { type: number }

    EpisodePage:
      type: object
      description: One window of the episodes table, with the caps that shaped it stated.
      properties:
        episodes:
          type: array
          items: { $ref: "#/components/schemas/Episode" }
        offset: { type: integer, format: int64 }
        limit: { type: integer, description: Page size actually applied after clamping }
        total: { type: integer, format: int64, description: Episode count as declared by the dataset }
        truncated: { type: boolean, description: The requested limit was clamped down }

    DatasetHint:
      type: object
      required: [value, kind, key]
      properties:
        value:
          type: string
          description: The root path or repo id read out of the run config.
        kind:
          type: string
          enum: [path, repo_id]
          description: >-
            How `value` identifies a dataset — a filesystem root matches
            `root_path` exactly, a repo id matches the dataset name or a root
            ending in that org/name pair.
        key:
          type: string
          description: The config key it came from, so a wrong proposal is debuggable.

    EpisodeSeries:
      type: object
      description: >-
        One episode's numeric channels against time, decimated host-side.
        Downsampling is decimation (every Nth frame), never averaging: a plot of
        joint angles is read for its extremes, and averaging erases exactly the
        spikes it is opened to find.
      properties:
        episode: { type: integer, format: int64 }
        length:
          type: integer
          format: int64
          description: "The episode's frame count BEFORE decimation, so a UI can say 1000 of 40000"
        fps: { type: number }
        stride: { type: integer, description: "Decimation applied; 1 means every frame" }
        points: { type: integer, description: Samples per channel actually returned }
        timestamps:
          type: array
          description: >-
            Seconds from the START of the episode, one per point. LeRobot's own
            timestamp column is already episode-relative in both generations.
          items: { type: number }
        series:
          type: array
          items: { $ref: "#/components/schemas/FeatureSeries" }
        downsampled: { type: boolean, description: "stride > 1, so the plot is not frame-exact" }
        truncated: { type: boolean, description: A cap dropped whole features or channels }
        warnings: { type: array, items: { type: string } }

    FeatureSeries:
      type: object
      description: One feature's channels — a 7-DoF arm yields seven.
      properties:
        key: { type: string }
        dtype: { type: string }
        channels:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: "From info.json names when the dataset labels its channels; empty otherwise"
              values:
                type: array
                description: "One value per point; null readings arrive as NaN, never 0"
                items: { type: number }

    EnvProfile:
      type: object
      description: >
        A reusable environment profile (plan env-profiles-and-session-teleport, E1),
        team-scoped. Metadata only (blueprint §4): env_vars + setup_script are
        hub-visible; secret_refs are REFERENCES into the team's zero-knowledge
        vault, never values. In E1 secret_refs + network_policy are stored and
        round-tripped but not yet consumed at spawn (host-key envelopes = E3,
        egress enforcement = E4).
      properties:
        id: { type: string }
        team_id: { type: string }
        name: { type: string, description: "unique within the team" }
        description: { type: string }
        setup_script:
          type: string
          description: bash run in the workdir before the agent cmd (hub-visible; no secrets)
        setup_failure_policy:
          type: string
          enum: [fail, continue]
          default: fail
          description: whether a non-zero setup script aborts the spawn (default fail-closed)
        env_vars:
          type: object
          additionalProperties: { type: string }
          description: "plain KEY=value map; keys must match ^[A-Za-z_][A-Za-z0-9_]*$"
        secret_refs:
          type: array
          description: references into the team vault — never values
          items:
            type: object
            properties:
              key: { type: string }
              vault_item: { type: string }
        network_policy:
          type: object
          description: declarative in E1; enforced in E4
          properties:
            mode: { type: string, enum: [open, allowlist, offline], default: open }
            allowlist: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Reference:
      type: object
      description: A research reference (ADR-053). Metadata only — PDF bytes are not stored here.
      properties:
        id: { type: string }
        team_id: { type: string }
        type:
          type: string
          enum: [article, preprint, book, report, webpage, note]
        title: { type: string }
        authors: { type: array, items: { type: string } }
        year: { type: integer, nullable: true }
        venue: { type: string }
        doi: { type: string }
        arxiv_id: { type: string }
        url: { type: string }
        pdf_url: { type: string }
        abstract: { type: string }
        tldr: { type: string }
        citation_count: { type: integer, nullable: true }
        source: { type: string }
        external_id: { type: string }
        tags: { type: array, items: { type: string } }
        collections: { type: array, items: { type: string } }
        notes: { type: string }
        body_markdown: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
        zotero_storage:
          type: object
          properties:
            key: { type: string }
            file: { type: string }
            content_type: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReferenceAnnotation:
      type: object
      description: >
        A PDF annotation on a reference (ADR-053, migration 0064). Metadata only —
        it points INTO the PDF, never mutating the bytes. Follows Zotero's model
        (annotations live in the store, not embedded in the file) so they sync as
        small deltas and can be tagged / filtered / listed as first-class items.
      properties:
        id: { type: string }
        reference_id: { type: string }
        team_id: { type: string }
        type:
          type: string
          enum: [highlight, underline, note, text, image, ink]
        color: { type: string, description: "hex, e.g. #ffd400" }
        page_index: { type: integer, description: "0-based; mirrors position.pageIndex" }
        sort_index: { type: string, description: "Zotero-style reading-order key (page+y+x)" }
        comment: { type: string }
        text: { type: string, description: "selected text (highlight/underline)" }
        author: { type: string, description: "director handle or agent kind" }
        position:
          type: object
          description: >
            Geometry, kept opaque and stored verbatim, in Zotero's shape — unscaled
            PDF points, origin bottom-left. Rect kinds:
            {"pageIndex":6,"rects":[[x1,y1,x2,y2]]}; ink:
            {"pageIndex":2,"paths":[[x1,y1,x2,y2]],"width":2}. Renderers multiply by
            the current zoom, so overlays land correctly at any scale.
        tags: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HostsPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
