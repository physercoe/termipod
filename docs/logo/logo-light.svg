<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermiPod light icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f5f9fe"/>
      <stop offset="100%" stop-color="#dfe9f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008f7e"/>
      <stop offset="46%" stop-color="#007fc9"/>
      <stop offset="100%" stop-color="#1558d6"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a9c7"/>
      <stop offset="100%" stop-color="#1256cf"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#168fd7" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#168fd7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#24aee8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- A crisp platform-sized tile. The stronger edge keeps the white icon
       distinct on translucent macOS docks without looking boxed at full size. -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="111" fill="url(#bg)" stroke="#b9c9dc" stroke-width="5"/>
  <path d="M112 57 C198 19 314 19 400 57" fill="none" stroke="#ffffff" stroke-opacity="0.78" stroke-width="4" stroke-linecap="round"/>

  <!-- Prompt + agent-at-cursor sparkle. Both shapes are deliberately bolder
       and larger than the document logo so their silhouettes hold at 16–64px. -->
  <path d="M122 137 L248 256 L122 375" fill="none" stroke="url(#accent)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(366 256)">
    <circle r="66" fill="url(#halo)"/>
    <path d="M 0,-46 Q 7,-7 46,0 Q 7,7 0,46 Q -7,7 -46,0 Q -7,-7 0,-46 Z" fill="url(#spark)"/>
  </g>
</svg>
