name: Build & Release Mobile

# A mobile-v* tag builds Android and unsigned iOS artifacts in parallel, then
# publishes one complete release only after both platform builds pass. Keeping
# publication in a single job prevents the two former workflows from racing to
# create or update the same GitHub release.

on:
  push:
    tags:
      - 'mobile-v*'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Resolve build metadata
        id: metadata
        run: scripts/mobile-build-metadata.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Build arm64-v8a APK
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          BUILD_GIT_REF: ${{ steps.metadata.outputs.git_ref }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --split-per-abi \
                --target-platform=android-arm64 \
                --obfuscate --split-debug-info=build/symbols \
                --build-name="$BUILD_NAME" \
                --build-number="$BUILD_NUMBER" \
                --dart-define=APP_VERSION="$GITHUB_REF_NAME" \
                --dart-define=GIT_REF="$BUILD_GIT_REF"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::APK build failed after 3 attempts"
              exit 1
            fi
            echo "::warning::APK build attempt $attempt failed; retrying after backoff"
            sleep $((attempt * 30))
          done

      - name: Rename APK
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.version }}
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "build/app/outputs/flutter-apk/Mobile-${BUILD_NAME}-android-arm64.apk"

      - name: Stage Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-android
          path: build/app/outputs/flutter-apk/Mobile-*-android-arm64.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if pod install; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::CocoaPods install failed after 3 attempts"
              exit 1
            fi
            rm -rf Pods
            sleep $((attempt * 10))
          done

      - name: Resolve build metadata
        id: metadata
        run: scripts/mobile-build-metadata.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Build iOS (unsigned)
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
          BUILD_GIT_REF: ${{ steps.metadata.outputs.git_ref }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$GITHUB_REF_NAME" \
            --dart-define=GIT_REF="$BUILD_GIT_REF"

      - name: Create unsigned IPA
        env:
          BUILD_NAME: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Mobile-${BUILD_NAME}-ios-unsigned.ipa" Payload

      - name: Stage iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-ios
          path: Mobile-*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    name: Publish mobile release
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: mobile-*
          path: assets
          merge-multiple: true

      - name: Resolve release version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "version=${RELEASE_TAG#mobile-v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            assets/Mobile-*-android-arm64.apk
            assets/Mobile-*-ios-unsigned.ipa
          fail_on_unmatched_files: true
          name: Mobile ${{ steps.metadata.outputs.version }}
          body: |
            **Mobile:**
            - `Mobile-<ver>-android-arm64.apk` — Android 8+ arm64 devices.
            - `Mobile-<ver>-ios-unsigned.ipa` — unsigned iOS device-test build.

            Hub and host-runner binaries ship in their own releases
            (`hub-v*` / `host-v*`).
          generate_release_notes: true
