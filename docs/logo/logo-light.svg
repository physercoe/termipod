  <rect x="12" y="8" width="488" height="488" rx="110" fill="url(#tile)" stroke="#74889f" stroke-opacity="0.42" stroke-width="2" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="12" y="8" width="488" height="488" fill="url(#tileLight)"/>
  </g>

  <path d="M126 137 L250 256 L126 375" transform="translate(4 8)" fill="none" stroke="#7188a2" stroke-opacity="0.42" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 137 L250 256 L126 375" fill="none" stroke="url(#prompt)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#formShadow)"/>

  <path d="M371 216 C376 243 390 252 417 256 C390 261 376 271 371 298 C366 271 352 261 325 256 C352 252 366 243 371 216Z" transform="translate(3 7)" fill="#7088a3" opacity="0.36"/>
  <path d="M371 216 C376 243 390 252 417 256 C390 261 376 271 371 298 C366 271 352 261 325 256 C352 252 366 243 371 216Z" fill="url(#spark)" filter="url(#formShadow)"/>
