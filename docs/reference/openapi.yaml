    HostUpdateProgress:
      type: object
      description: >
        One self-update progress sample posted by a host-runner mid-update
        (host.update acks after resolve; the download runs in the background
        and streams these). The hub keeps only the latest sample per host,
        stamps `at` server-side, and serves it owner-scope at
        GET /v1/admin/hosts/{host}/update-progress (phase "idle" when the
        host never reported).
      properties:
        phase: { type: string, enum: [downloading, installing, done, error] }
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        to_version: { type: string }
        error: { type: string }
        at: { type: string, format: date-time }
      required: [phase]

    SSHHint:
      type: object
      description: Non-secret SSH hint — never includes credentials
      properties:
        hostname: { type: string }
        port: { type: integer }
        username: { type: string }
        jump_host: { type: string }

    HostCapabilities:
      type: object
      properties:
        agents:
          type: object
          additionalProperties:
            type: object
            properties:
              installed: { type: boolean }
              version: { type: string }
              supports:
                type: array
                items: { type: string, enum: [M1, M2, M4] }
        probed_at: { type: string, format: date-time }

    HostCommandsPage:
      type: array
      items: { $ref: "#/components/schemas/HostCommand" }

    HostCommand:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        host_id: { type: string }
        agent_id: { type: string }
        kind: { type: string }
        args: { type: object, additionalProperties: true }
        status:
          type: string
          enum: [pending, delivered, done, failed]
          description: >-
            For a detached host job (ADR-058) `delivered` means *running*; the
            lifecycle gained no new state.
        result: { type: object, additionalProperties: true }
        error: { type: string }
        progress:
          type: object
          additionalProperties: true
          description: >-
            A running host job's coarse `{phase, done, total}`. Absent for
            inline kinds, which never report progress.
        progress_at:
          type: string
          description: >-
            Hub receipt time of the last progress patch — stamped by the hub,
            never taken from the payload. The stale-job sweep compares against
            this.
        created_at: { type: string }
        delivered_at: { type: string }
        completed_at: { type: string }

