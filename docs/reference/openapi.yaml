openapi: 3.1.0
info:
  title: termipod hub HTTP API
  description: |
    Authoritative OpenAPI specification for the termipod hub HTTP
    surface. Every `/v1/...` endpoint is listed by tag (resource
    group) with request / response shapes and the auth scheme.

    **Version model.** This spec covers `v1`. Additive changes
    (new endpoints, new optional fields) ship under `v1`; breaking
    changes would bump to `/v2/`. The hub reports its build at
    `GET /v1/_info` and the mobile client checks
    `supported_api_versions` at startup.

    **Cross-references.**
    - [`api-overview.md`](api-overview.md) — endpoint index +
      cross-cutting conventions (this spec is the machine-readable
      form).
    - [`database-schema.md`](database-schema.md) — physical schema
      that backs the response shapes.
    - [`audit-events.md`](audit-events.md) — the canonical taxonomy
      of `audit_events` rows referenced from response payloads.

    Status: draft. Hand-written; first issuance 2026-05-05 from
    `hub/internal/server/server.go` route table at v1.0.351.
  version: "1.0.351-alpha"
  license:
    name: Apache-2.0
    url: https://github.com/physercoe/termipod/blob/main/LICENSE
  contact:
    name: termipod issue tracker
    url: https://github.com/physercoe/termipod/issues

servers:
  - url: "https://hub.example.com"
    description: Production hub (replace with operator's hub URL)
  - url: "http://127.0.0.1:8443"
    description: Local development (cleartext on loopback only)

security:
  - bearerAuth: []

tags:
  - name: Meta
    description: Server info, search, MCP entry point
  - name: Hosts
    description: Host registration, heartbeat, A2A directory
  - name: Agents
    description: Agent CRUD + spawn + lifecycle + AG-UI events
  - name: Sessions
    description: Per-agent conversational sessions
  - name: Projects
    description: Projects + lifecycle (phases, deliverables, criteria)
  - name: Plans
    description: Plans, plan steps, schedules
  - name: Runs
    description: Experiments + metrics
  - name: Documents
    description: Documents, reviews, artifacts, blobs
  - name: Channels
    description: Channels + events
  - name: Tasks
    description: Project tasks
  - name: Attention
    description: Attention queue + resolution
  - name: Admin
    description: Audit, policy, tokens, principals
  - name: Templates
    description: Project + agent + step templates
  - name: MCP
    description: Single MCP service entry point
  - name: EnvProfiles
    description: Reusable environment profiles attached to spawns (setup script + env + secret refs + net policy)
  - name: Datasets
    description: Episode corpora a policy trains on or is evaluated against (replay plan W1)
  - name: References
    description: The hub-owned research reference library + PDF annotations (ADR-053)

paths:

  # ======================================================================
  # Meta + system
  # ======================================================================

  /v1/_info:
    get:
      tags: [Meta]
      operationId: getInfo
      summary: Server build metadata
      security: []
      responses:
        "200":
          description: Server info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
              example:
                server_version: "1.0.351-alpha"
                supported_api_versions: ["v1"]
                schema_versions_supported: [1]
                commit: "0426abe..."
                build_time: "2026-04-25T15:00:00Z"
                modified: false

  /v1/search:
    get:
      tags: [Meta]
      operationId: search
      summary: Full-text search across events + agent_events
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  # ======================================================================
  # Hosts + A2A
  # ======================================================================

  /v1/teams/{team}/datasets:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: List the team's registered datasets (replay plan W1)
      parameters:
        - { name: project, in: query, required: false, schema: { type: string } }
        - { name: host, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dataset" }
    post:
      tags: [Datasets]
      operationId: createDataset
      summary: >-
        Register a dataset root. Idempotent on (project, host, root_path):
        a repeat returns 200 with the existing row rather than a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Dataset" }
      responses:
        "200":
          description: Already registered; the existing row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: "Project or host not found in this team" }

  /v1/teams/{team}/datasets/{dataset}:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: dataset, in: path, required: true, schema: { type: string } }
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Get one dataset
      responses:
        "200":
          description: Dataset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Datasets]
      operationId: updateDataset
      summary: >-
        Update the human-owned fields (name, env_ref). Location and digest are
        deliberately not patchable: moving a root is a re-registration, and a
        digest that did not come from a host read would be an unchecked fact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Dataset" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Datasets]
      operationId: deleteDataset
      summary: >-
        Remove the hub's index entry. Never touches the host — the dataset's
        bytes are not the hub's to delete.
      responses:
        "204": { description: "De-registered" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/datasets/{dataset}/refresh:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: dataset, in: path, required: true, schema: { type: string } }
    post:
      tags: [Datasets]
      operationId: refreshDatasetDigest
      summary: >-
        Ask the owning host to re-read the root and store the fold. Manual by
        design (replay plan decision #4) — nothing re-reads a dataset unasked.
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dataset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The dataset has no host, so it cannot be read" }
        "422":
          description: >-
            The host recognised a dataset but refuses its generation. The
            codebase_version it refused is carried through so the client can
            name it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetUnsupportedFormat" }
        "501": { description: "Remote roots are not readable yet (SSH-forward wedge)" }
        "504": { description: "The host did not answer in time" }

  /v1/teams/{team}/datasets/{dataset}/episodes:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: dataset, in: path, required: true, schema: { type: string } }
    get:
      tags: [Datasets]
      operationId: listDatasetEpisodes
      summary: >-
        One window of the dataset's episodes table, proxied from the host. The
        table is never stored hub-side — a 50k-episode listing is bulk data
        (blueprint §4), so it is read on demand, windowed and capped.
      parameters:
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: One page of episodes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The dataset has no host, so it cannot be read" }
        "501": { description: "Remote roots are not readable yet (SSH-forward wedge)" }
        "504": { description: "The host did not answer in time" }

  /v1/teams/{team}/datasets/{dataset}/episodes/{episode}/series:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: dataset, in: path, required: true, schema: { type: string } }
      - { name: episode, in: path, required: true, schema: { type: integer, minimum: 0 } }
    get:
      tags: [Datasets]
      operationId: getDatasetEpisodeSeries
      summary: >-
        One episode's numeric channels against time, decimated host-side to a
        point budget. Never stored: an episode is megabytes of parquet and the
        answer is kilobytes of floats, which is precisely the split the
        data-ownership law draws (blueprint §4).
      parameters:
        - name: features
          in: query
          required: false
          description: >-
            Comma-separated feature keys; omit for every numeric feature.
            Keys contain dots ("observation.state") but never commas.
          schema: { type: string }
        - name: max_points
          in: query
          required: false
          description: "Per-channel point budget; the host clamps it and reports the stride it applied."
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: One episode's series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeSeries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The dataset has no host, so it cannot be read" }
        "422": { description: "The dataset's codebase_version is not supported" }
        "501": { description: "Remote roots are not readable yet (SSH-forward wedge)" }
        "504": { description: "The host did not answer in time" }

  /v1/teams/{team}/datasets/{dataset}/export:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: dataset, in: path, required: true, schema: { type: string } }
    post:
      tags: [Datasets]
      operationId: exportDatasetEpisode
      summary: Submit a Rerun `.rrd` export of one episode as a host job (ADR-058)
      description: >-
        Returns a command id to poll at `/commands/{cmd}`, not a file: the export
        decodes every frame of the episode, so it runs detached on the host and
        no request is held open for it. A repeat submission of an export already
        in flight joins it and comes back with `reused: true` rather than
        queueing a second pass over the same frames. Artifacts stay host-local.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [episode_index]
              properties:
                episode_index: { type: integer, minimum: 0 }
                repo_id:
                  type: string
                  description: >-
                    LeRobot's `owner/name` identity. Optional — the host derives
                    it from the root's last two segments and reports back what
                    it used.
      responses:
        "202":
          description: Submitted (or joined an identical in-flight export)
          content:
            application/json:
              schema:
                type: object
                properties:
                  command_id: { type: string }
                  kind: { type: string }
                  reused: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The dataset has no host, or the host reports the pinned
            (lerobot, rerun-sdk) pair unavailable — the body carries the host's
            own detail.
        "501": { description: "Only local dataset roots can be exported today" }

  /v1/teams/{team}/env-profiles:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [EnvProfiles]
      operationId: listEnvProfiles
      summary: List the team's environment profiles (env-profiles plan, E1)
      responses:
        "200":
          description: Environment profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EnvProfile" }
    post:
      tags: [EnvProfiles]
      operationId: createEnvProfile
      summary: Create an environment profile (unique name per team → 409 on duplicate)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvProfile" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: A profile with that name already exists }

  /v1/teams/{team}/env-profiles/{profile}:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: profile, in: path, required: true, schema: { type: string } }
    get:
      tags: [EnvProfiles]
      operationId: getEnvProfile
      summary: Get one environment profile
      responses:
        "200":
          description: Environment profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [EnvProfiles]
      operationId: updateEnvProfile
      summary: Partially update a profile (present fields replace; env_vars replaced wholesale)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvProfile" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [EnvProfiles]
      operationId: deleteEnvProfile
      summary: Delete an environment profile
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/references:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [References]
      operationId: listReferences
      summary: List references in the team's library (ADR-053)
      parameters:
        - { name: collection, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: References
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reference" }
    post:
      tags: [References]
      operationId: createReference
      summary: Add a reference to the library
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reference" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/teams/{team}/references/{ref}:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      tags: [References]
      operationId: getReference
      summary: Get one reference
      responses:
        "200":
          description: Reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [References]
      operationId: updateReference
      summary: Partially update a reference (present fields override)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reference" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [References]
      operationId: deleteReference
      summary: Delete a reference
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/references/{ref}/annotations:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      tags: [References]
      operationId: listReferenceAnnotations
      summary: List a reference's PDF annotations (ADR-053), page + reading order
      responses:
        "200":
          description: Annotations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReferenceAnnotation" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [References]
      operationId: createReferenceAnnotation
      summary: Add a PDF annotation to a reference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceAnnotation" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceAnnotation" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/references/{ref}/annotations/{ann}:
    parameters:
      - $ref: "#/components/parameters/Team"
      - { name: ref, in: path, required: true, schema: { type: string } }
      - { name: ann, in: path, required: true, schema: { type: string } }
    get:
      tags: [References]
      operationId: getReferenceAnnotation
      summary: Get one annotation
      responses:
        "200":
          description: Annotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceAnnotation" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [References]
      operationId: updateReferenceAnnotation
      summary: Partially update an annotation (present fields override)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceAnnotation" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceAnnotation" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [References]
      operationId: deleteReferenceAnnotation
      summary: Delete an annotation
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/hosts:
    parameters:
      - $ref: "#/components/parameters/Team"
    post:
      tags: [Hosts]
      operationId: registerHost
      summary: Register a host (host-runner first boot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostRegisterRequest"
      responses:
        "201":
          description: Host registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [Hosts]
      operationId: listHosts
      summary: List hosts in team
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Hosts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostsPage"

  /v1/teams/{team}/hosts/{host}:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    get:
      tags: [Hosts]
      operationId: getHost
      summary: Get one host
      responses:
        "200":
          description: Host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Hosts]
      operationId: deleteHost
      summary: Delete a host (admin)
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{team}/hosts/{host}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    post:
      tags: [Hosts]
      operationId: hostHeartbeat
      summary: Heartbeat with build metadata + capabilities
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostHeartbeat" }
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Host" }

  /v1/teams/{team}/hosts/{host}/update-progress:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    post:
      tags: [Hosts]
      operationId: hostUpdateProgress
      summary: Report self-update progress (latest sample per host wins)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostUpdateProgress" }
      responses:
        "200": { description: Sample stored }
        "400": { description: Unknown phase / malformed body }

  /v1/teams/{team}/hosts/{host}/commands:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    get:
      tags: [Hosts]
      operationId: listHostCommands
      summary: Pull queued out-of-band commands
      parameters:
        - in: query
          name: status
          description: >-
            Defaults to `pending`, which also flips the returned rows to
            `delivered` (the queue is claimed on read). Any other status is a
            plain read; `delivered` is what a restarting host-runner lists to
            fail the jobs its previous process abandoned.
          schema: { type: string, enum: [pending, delivered, done, failed] }
      responses:
        "200":
          description: Commands page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostCommandsPage" }

  /v1/teams/{team}/hosts/{host}/ssh_hint:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    patch:
      tags: [Hosts]
      operationId: updateHostSSHHint
      summary: Update non-secret SSH hint (no credentials)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHHint" }
      responses:
        "200": { description: Updated }

  /v1/teams/{team}/hosts/{host}/capabilities:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    put:
      tags: [Hosts]
      operationId: updateHostCapabilities
      summary: Replace binary-presence map
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostCapabilities" }
      responses:
        "200": { description: Updated }

  /v1/teams/{team}/hosts/{host}/a2a/cards:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    put:
      tags: [Hosts]
      operationId: putHostA2ACards
      summary: Publish per-host A2A agent cards
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/A2ACard" }
      responses:
        "200": { description: Published }

  /v1/teams/{team}/hosts/{host}/a2a/tunnel/next:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    get:
      tags: [Hosts]
      operationId: tunnelNext
      summary: Long-poll next A2A tunnel request
      responses:
        "200":
          description: Tunnel request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelRequest" }

  /v1/teams/{team}/hosts/{host}/a2a/tunnel/responses:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Host"
    post:
      tags: [Hosts]
      operationId: tunnelResponse
      summary: Post A2A tunnel response back to relay
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TunnelResponse" }
      responses:
        "204": { description: Accepted }

  /v1/teams/{team}/a2a/cards:
    parameters:
      - $ref: "#/components/parameters/Team"
    get:
      tags: [Hosts]
      operationId: listTeamA2ACards
      summary: Team-wide A2A agent-card directory
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/A2ACard" }

  /v1/teams/{team}/commands/{cmd}:
    parameters:
      - $ref: "#/components/parameters/Team"
      - in: path
        name: cmd
        required: true
        schema: { type: string }
    get:
      tags: [Hosts]
      operationId: getHostCommand
      summary: Read one host command (host-job status poll)
      description: >-
        Team scope is joined through the command's host, which is what a host-job
        poller reads: status, progress, result, error. For a host job
        `delivered` means running.
      responses:
        "200":
          description: The command row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostCommand" }
        "404": { description: No such command in this team }
    patch:
      tags: [Hosts]
      operationId: patchHostCommand
      summary: Report host-command outcome, or a running job's progress
      description: >-
        With a status this is the terminal report. With `progress` and no
        status it is a detached job's heartbeat (ADR-058 §3): it updates
        `progress_json` + `progress_at` and touches nothing else, which is why
        the command statuses needed no new value.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [done, failed]
                  description: Omit only when reporting progress.
                result: { type: object, additionalProperties: true }
                error: { type: string }
                progress:
                  type: object
                  additionalProperties: true
                  description: >-
                    Ignored when a status is also present — the terminal report
                    is authoritative.
      responses:
        "204": { description: Updated }
        "400": { description: Malformed body, or neither a status nor progress }
        "404": { description: No such command }
        "409": { description: Progress reported for a command that is not running }
        "413": { description: Progress payload too large }

  /v1/teams/{team}/commands/{cmd}/cancel:
    parameters:
      - $ref: "#/components/parameters/Team"
      - in: path
        name: cmd
        required: true
        schema: { type: string }
    post:
      tags: [Hosts]
      operationId: cancelHostCommand
      summary: Ask the owning host to stop a running host job
      description: >-
        Enqueues the inline `job_cancel` kind rather than mutating the target
        row: the hub cannot stop a subprocess, and a row flipped to failed while
        the work continued would leave the host busy on nothing. The target's
        own outcome is reported by the host. Already-finished is a no-op.
      responses:
        "202": { description: Cancel enqueued }
        "204": { description: Already finished — nothing to cancel }
        "400": { description: Not a detached host job }
        "404": { description: No such command in this team }

