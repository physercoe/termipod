<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermiPod">
  <defs>
    <linearGradient id="tile" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#17455a"/>
      <stop offset="45%" stop-color="#132b43"/>
      <stop offset="100%" stop-color="#211b3c"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="30%" cy="12%" r="82%">
      <stop offset="0%" stop-color="#35d7da" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#2b8ed5" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#172239" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prompt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cf2db"/>
      <stop offset="48%" stop-color="#38c4e8"/>
      <stop offset="100%" stop-color="#6c7cf2"/>
    </linearGradient>
    <linearGradient id="spark" x1="14%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#f1ffff"/>
      <stop offset="48%" stop-color="#9de8f8"/>
      <stop offset="100%" stop-color="#8d8af3"/>
    </linearGradient>
    <filter id="tileShadow" x="-18%" y="-18%" width="136%" height="148%">
      <feDropShadow dx="0" dy="11" stdDeviation="12" flood-color="#05070e" flood-opacity="0.58"/>
    </filter>
    <filter id="formShadow" x="-28%" y="-28%" width="165%" height="175%">
      <feDropShadow dx="3" dy="9" stdDeviation="8" flood-color="#070d20" flood-opacity="0.56"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="12" y="8" width="488" height="488" rx="110"/>
    </clipPath>
  </defs>

  <!-- One quiet slab, like a macOS system-app icon. The glyphs provide the
       depth; the container stays deliberately free of frames and decoration. -->
  <rect x="12" y="8" width="488" height="488" rx="110" fill="url(#tile)" stroke="#b8d8ec" stroke-opacity="0.24" stroke-width="2" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="12" y="8" width="488" height="488" fill="url(#tileLight)"/>
  </g>

  <!-- Terminal prompt and agent spark: two simple raised forms. -->
  <path d="M126 137 L250 256 L126 375" transform="translate(4 8)" fill="none" stroke="#080f25" stroke-opacity="0.52" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 137 L250 256 L126 375" fill="none" stroke="url(#prompt)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#formShadow)"/>

  <path d="M371 216 C376 243 390 252 417 256 C390 261 376 271 371 298 C366 271 352 261 325 256 C352 252 366 243 371 216Z" transform="translate(3 7)" fill="#080f25" opacity="0.48"/>
  <path d="M371 216 C376 243 390 252 417 256 C390 261 376 271 371 298 C366 271 352 261 325 256 C352 252 366 243 371 216Z" fill="url(#spark)" filter="url(#formShadow)"/>
</svg>
