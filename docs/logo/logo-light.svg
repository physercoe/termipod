<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermiPod light icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8edf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ad9a"/>
      <stop offset="48%" stop-color="#0099db"/>
      <stop offset="100%" stop-color="#176fe5"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b9d9"/>
      <stop offset="100%" stop-color="#1878e8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24aee8" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#24aee8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#24aee8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- One full-size light squircle; no inset tile or boxed frame. -->
  <rect x="1" y="1" width="510" height="510" rx="112" fill="url(#bg)" stroke="#d7e0eb" stroke-width="2"/>

  <!-- Canonical terminal prompt and agent-at-cursor sparkle. -->
  <path d="M140 162 L235 256 L140 350" fill="none" stroke="url(#accent)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(345 256)">
    <circle r="52" fill="url(#halo)"/>
    <path d="M 0,-34 Q 5.1,-5.1 34,0 Q 5.1,5.1 0,34 Q -5.1,5.1 -34,0 Q -5.1,-5.1 0,-34 Z" fill="url(#spark)"/>
  </g>
</svg>
