<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TermiPod app icon">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213a"/>
      <stop offset="52%" stop-color="#0b1428"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ce0be"/>
      <stop offset="48%" stop-color="#24b8ec"/>
      <stop offset="100%" stop-color="#3b83f7"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eafbff"/>
      <stop offset="100%" stop-color="#79e8ff"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="35%" cy="27%" r="74%">
      <stop offset="0%" stop-color="#2ce0be" stop-opacity="0.13"/>
      <stop offset="58%" stop-color="#218ee8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#218ee8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#46dfff" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#2fc9ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2fc9ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="2.5" y="2.5" width="507" height="507" rx="111"/>
    </clipPath>
  </defs>

  <!-- Midnight terminal tile: dark enough to separate from neighboring apps,
       but blue rather than black so the silhouette survives a dark Dock. -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="111" fill="url(#bg)" stroke="#293a57" stroke-width="5"/>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#tileGlow)"/>
  </g>

  <!-- The prompt is primary; the brighter spark reads as the agent at the
       cursor. Large, simple silhouettes remain legible down to Dock size. -->
  <path d="M122 137 L248 256 L122 375" fill="none" stroke="url(#accent)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(366 256)">
    <circle r="68" fill="url(#halo)"/>
    <path d="M 0,-46 Q 7,-7 46,0 Q 7,7 0,46 Q -7,7 -46,0 Q -7,-7 0,-46 Z" fill="url(#spark)"/>
  </g>
</svg>
