# Kimi Code steward template.
#
# Drives `kimi acp` from Kimi Code CLI (MoonshotAI/kimi-code — single
# compiled TypeScript binary, data root ~/.kimi-code) as a long-running
# stdio JSON-RPC daemon via the M1/ACP path (ACPDriver, driver_acp.go).
#
# ADR-054 is the authoritative design; docs/plans/kimi-code-ts-engine.md
# carries the on-host verification record (kimi-code 0.27.0). Key
# decisions:
#   - M1-only. The build ships an ACP daemon (`kimi acp`,
#     protocolVersion 1, loadSession: true). M4 (tmux pane) is the sole
#     fallback when ACP can't negotiate. A headless
#     `-p --output-format stream-json` mode exists upstream but is
#     unwired (its NDJSON schema needs its own frame profile; plan §2).
#   - Authentication is out-of-band via `kimi login` (device-code
#     flow) run interactively on the host. Until login completes,
#     session/new fails and ACPDriver surfaces the AUTH_REQUIRED
#     remediation pointing at `kimi login`.
#   - MCP injection is file-based: the hub writes
#     <workdir>/.kimi-code/mcp.json per spawn and the engine
#     auto-discovers it (project level, precedence over the
#     operator's user-level ~/.kimi-code/mcp.json, which stays
#     untouched).
#
# Built-in. Copied to team/templates/agents/ on first init; user
# edits win — subsequent inits never overwrite.
template: agents.steward.kimi-ts
version: 1
extends: null

# M1 (ACP daemon) is the only wired shape for kimi today; M4 keeps a
# transcript when ACP can't negotiate (binary mismatch — e.g. a stale
# Python-kimi install — daemon crashed mid-handshake). No M2 fallback
# yet — see plan §2.
driving_mode: M1
fallback_modes: [M4]

backend:
  kind: kimi-code-ts
  # default_workdir intentionally omitted — auto-derives
  # ~/hub-work/<pid8>/<handle> from the spawn so per-project kimi
  # stewards stay isolated on shared hosts.
  # cmd is what host-runner executes via `bash -c "cd <workdir> &&
  # <cmd>"`. It is the INTERACTIVE base form — the M1 subcommand
  # (`acp`) is composed on at launch from the engine family's
  # launch.M1.mode_args (ADR-043, #378), so an M4 fallback spawns a
  # usable TUI from this same cmd.
  #
  # --yolo (-y) auto-approves all tool calls at the engine layer.
  # This INTENTIONALLY bypasses ACP's session/request_permission gate
  # — same consent posture as an operator driving the TUI with yolo
  # on, at the opposite end of the consent spectrum from gemini's
  # steward (which omits --yolo precisely so the ACP gate fires).
  # Operators who want per-call principal consent override this cmd
  # in their team-local steward.kimi-ts.v1.yaml overlay. See
  # ADR-054 D2.
  #
  # Thinking is config-driven (~/.kimi-code/config.toml [thinking])
  # and per-session via ACP config options, so there is nothing to
  # pass here.
  cmd: "kimi --yolo"

default_role: team.coordinator
display_label: "Steward (kimi-ts)"

# Same governance shape as the claude / codex / gemini / kimi
# stewards — the kimi-ts steward coordinates the same way once the
# daemon model is hidden by the driver.
default_capabilities:
  - blob.read
  - blob.write
  - delegate
  - decision.vote: significant
  - spawn.descendants: 20
  - templates.read
  - templates_propose
  - tasks_create
  - tasks.assign_others
  - projects_create

prompt: steward.kimi-ts.v1.md

skills:
  - id: plan
    name: plan
    description: "Decompose a project goal into plan steps"
    tags: [planning]
  - id: brief
    name: brief
    description: "Write a briefing document summarizing run outputs"
    tags: [writing]

default_channels:
  hub-meta: full
