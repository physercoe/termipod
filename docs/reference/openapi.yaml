        trigger_kind: { type: string, enum: [cron, manual, on_create] }
        cron_expr: { type: string }
        parameters_json: { type: object }
        enabled: { type: boolean }

    Run:
      type: object
      required: [id, project_id, status]
      properties:
        id: { type: string }
        project_id: { type: string }
        agent_id: { type: string, nullable: true }
        config_json: { type: object }
        seed: { type: integer }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        trackio_host_id: { type: string, nullable: true }
        trackio_run_uri: { type: string, nullable: true }
        parent_run_id: { type: string, nullable: true }
        dataset_id:
          type: string
          nullable: true
          description: >-
            The dataset this run trained on or rolled out against (replay plan
            W5). Set with PATCH; cleared when that dataset is deleted.
        final_metrics_json: { type: object }

    RunCreateRequest:
      type: object
      required: [project_id]
      properties:
        project_id: { type: string }
        config_json: { type: object }
        seed: { type: integer }
        trackio_host_id: { type: string }
        trackio_run_uri: { type: string }
        parent_run_id: { type: string }

    RunMetricsBatch:
      type: object
      properties:
        metrics:
          type: array
          items:
            type: object
            required: [name, points]
            properties:
              name: { type: string }
              points:
                type: array
                items:
                  type: object
                  properties:
                    step: { type: integer }
                    value: { type: number }

    RunImagesBatch:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              checkpoints:
                type: array
                items:
                  type: object
                  properties:
                    step: { type: integer }
                    blob_sha256: { type: string }

    RunHistogramsBatch:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              checkpoints:
                type: array
                items:
                  type: object
                  properties:
                    step: { type: integer }
                    bins:
                      type: array
                      items: { type: number }
                    counts:
                      type: array
                      items: { type: integer }

    AttentionItem:
      type: object
      required: [id, scope_kind, kind, severity, status, summary]
      properties:
        id: { type: string }
        project_id: { type: string, nullable: true }
        scope_kind:
          type: string
          enum: [team, project, channel]
        scope_id: { type: string, nullable: true }
        kind: { type: string }
        ref_event_id: { type: string, nullable: true }
        ref_task_id: { type: string, nullable: true }
        summary: { type: string }
        severity:
          type: string
          enum: [info, minor, major, critical]
        current_assignees_json:
          type: array
          items: { type: string }
        decisions_json:
          type: array
          items:
            type: object
            additionalProperties: true
        escalation_history_json:
          type: array
          items:
            type: object
            additionalProperties: true
        status: { type: string, enum: [open, resolved] }
        actor_kind: { type: string, nullable: true }
        actor_handle: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    AttentionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AttentionItem" }

    AttentionCreateRequest:
      type: object
      required: [kind, scope_kind, summary]
      properties:
        kind: { type: string }
        scope_kind: { type: string }
        scope_id: { type: string }
        summary: { type: string }
        severity: { type: string }
        ref_event_id: { type: string }
        ref_task_id: { type: string }

    AttentionDecideRequest:
      type: object
      required: [choice]
      properties:
        choice: { type: string }
        comment: { type: string }

    AttentionContext:
      type: object
      properties:
        attention: { $ref: "#/components/schemas/AttentionItem" }
        events:
          type: array
          items:
            type: object
            additionalProperties: true

    AuditEvent:
      type: object
      required: [id, ts, actor_kind, action]
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor_kind: { type: string }
        actor_handle: { type: string, nullable: true }
        actor_id: { type: string, nullable: true }
        action: { type: string }
        target_kind: { type: string }
        target_id: { type: string }
        meta_json: { type: object }

    AuditEventsPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditEvent" }

    AuthToken:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [owner, user, agent, host] }
        scope_json: { type: object }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        rotated_from: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    IssueTokenRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [owner, user, agent, host] }
        role: { type: string }
        agent_id: { type: string }
        handle: { type: string }
        team: { type: string }
        scope_json: { type: object }

    IssuedToken:
      allOf:
        - $ref: "#/components/schemas/AuthToken"
        - type: object
          required: [plaintext]
          properties:
            plaintext:
              type: string
              description: Shown once at issuance — never persisted

    Principal:
      type: object
      properties:
        kind: { type: string, enum: [user, agent] }
        handle: { type: string }
        agent_id: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }

    Template:
      type: object
      properties:
        category: { type: string }
        name: { type: string }
        body: { type: string }
        source: { type: string, enum: [bundled, user] }

    TemplatesPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Template" }
