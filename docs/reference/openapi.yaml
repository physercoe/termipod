      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Agent"
      - $ref: "#/components/parameters/Session"
    post:
      tags: [Sessions]
      operationId: resumeSession
      summary: Resume with engine-specific cursor (e.g. claude --resume)
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /v1/teams/{team}/sessions/{session}/teleport:
    parameters:
      - $ref: "#/components/parameters/Team"
      - $ref: "#/components/parameters/Session"
    post:
      tags: [Sessions]
      operationId: teleportSession
      summary: >-
        Move a paused session to another host (ADR-057). Relocates the session's
        byte-stores to the target and continues there; the transcript is
        unchanged. A worktree session (T1) moves its files via git and needs a
        shared git remote; a non-worktree session (T2a) moves its whole working
        directory as a tar bundle (256 MiB compressed cap). Session must be
        paused (409 otherwise). A secret-bearing session (its env profile carries
        secret_refs) is refused unless the request supplies env_secret_envelope
        re-sealed to the target host — the hub cannot re-seal (ADR-056 D-6, D-7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_host_id]
              properties:
                target_host_id:
                  type: string
                  description: Host to move the session to; must be online and not the current host.
                env_secret_envelope:
                  type: string
                  description: >-
                    The session's vault secrets re-sealed to the TARGET host's
                    key by a vault-holding client (opaque JSON; ADR-056 D-3).
                    Required for a secret-bearing session, ignored otherwise. Its
                    host_id must equal target_host_id (400 on mismatch); the hub
                    never opens it. Fetch the session's env_profile_id from the
                    single-session GET to find which secret_refs to re-seal.
      responses:
        "200":
          description: Teleported
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  source_host: { type: string }
                  target_host: { type: string }
                  new_agent_id: { type: string }
                  worktree_path:
                    type: string
                    description: Target-side worktree path (worktree sessions only; empty otherwise).
                  workdir:
                    type: string
                    description: Target-side working directory (non-worktree sessions only; empty otherwise).
        "400":
          description: env_secret_envelope is malformed or not sealed to the target host
        "409":
          description: >-
            Not paused, same host, target offline, a session with nothing to
            relocate (no worktree and no derivable workdir), or a secret-bearing
            session teleported without a re-sealed envelope
        "502":
          description: Pack or unpack failed on a host

